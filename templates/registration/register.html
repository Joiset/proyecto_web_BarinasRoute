{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Registro - BarinasRoute{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <h3 class="fw-bold text-center mb-3">Registro de Usuario</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-success w-100 mt-3">Registrarse</button>
                </form>
                <div class="text-center mt-3">
                    <small>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
